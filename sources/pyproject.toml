[project]
name = "unified-search-sources"
requires-python = ">=3.12, <3.13"
version = "2.6.2"
dependencies = [
    "certifi",
    "django>=5.2,<6",
    "django-cors-headers",
    "django-csp",
    "django-environ",
    "django-health-check<3.21",  # 3.21 renamed BaseHealthCheckBackend to HealthCheck
    "django-logger-extra",
    "django-munigeo",
    "django-parler<2.4",  # munigeo 0.3.12 has no migration for parler 2.4 constraints
    "elasticsearch",
    "pyhumps",
    "python-dotenv",
    "requests",
    "sentry-sdk",
]

[dependency-groups]
dev = [
    "ipython",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "snapshottest>=1.0.0a1",
]
prod = [
    "uwsgi<3",
]

[tool.uv]
package = false
exclude-newer = "P3D"
# url-normalize is a transitive dependency (via requests-cache, pulled in by
# django-munigeo). Pinned below the current major version to avoid an
# unrelated behavioral change while migrating to uv.
constraint-dependencies = ["url-normalize<3"]

[tool.ruff]
extend-exclude = ["migrations", "snapshots"]

[tool.ruff.lint]
# See https://docs.astral.sh/ruff/rules/ for documentation of rules
# Keep the pre-Ruff 0.16 default rules explicit. Ruff 0.16 expanded its
# default rule set substantially, which would otherwise enable unrelated rules.
select = [
    "E4",
    "E7",
    "E9",
    "F",
]
extend-select = [
    "B01", # Enable B01* part of flake8-bugbear (B) rules, e.g. B015 and B018
    "C90", # Enable mccabe (C90) rules
    "E",   # Enable pycodestyle error (E) rules
    "F",   # Enable Pyflakes (F) rules
    "I",   # Enable isort (I) rules
    "W",   # Enable pycodestyle warning (W) rules
]
ignore = [
    # FIXME: Fix underlying problems and remove ignores:
    "E741",    # Ignore ambiguous-variable-name (E741), e.g. using "l" as a variable name
]

[tool.ruff.lint.isort]
# isort options for ruff:
# https://docs.astral.sh/ruff/settings/#lintisort
order-by-type = false # Don't use type (i.e. case) to sort imports
known-first-party = [
    "common",
    "custom_health_checks",
    "ingest",
    "sources",
]

[tool.ruff.format]
docstring-code-format = true # Format code in docstrings

[tool.coverage.run]
# Coverage run options:
# https://coverage.readthedocs.io/en/latest/config.html#run
branch = true
omit = ["*migrations*", "*site-packages*", "*venv*"]

[tool.pytest.ini_options]
# pytest-django options:
# https://pytest-django.readthedocs.io/en/latest/configuring_django.html
DJANGO_SETTINGS_MODULE = "sources.settings"

# pytest options:
# https://docs.pytest.org/en/stable/reference/reference.html#configuration-options
norecursedirs = ["node_modules", ".git", ".venv*", "venv*", ".pytest_cache"]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "IGNORE_EXCEPTION_DETAIL",
    "ALLOW_UNICODE",
]
